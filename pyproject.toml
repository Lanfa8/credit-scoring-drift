[project]
name = "credit-scoring-drift"
version = "0.1.0"
description = "Credit scoring monitoring: data contracts, drift detection, observability and governance"
authors = [
    { name = "Lanfa8", email = "alanfan139@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "evidently>=0.7.23",
    "joblib>=1.6.0",
    "mlflow>=3.18.0",
    "numpy>=2.5.4",
    "pandas>=2.2,<3",
    "pandera>=0.36.0",
    "plotly>=5.24.1",
    "prometheus-client>=0.26.0",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "tabulate>=0.10.0",
    "xgboost>=3.4.1",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::SyntaxWarning"]
